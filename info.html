<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>WeatherFit Info</title>

<body>
  <!-- Pencil-wobble filter used by .sketch borders and the character drawing -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </svg>
  <main>
    <a href="index.html">Back</a>
    <h1>Info</h1>
    <p>Skeleton: info content coming soon.</p>
  </main>
