<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherFit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pencil-wobble filter used by .sketch borders and the character drawing -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </svg>
  <main class="screen">
    <h1 class="visually-hidden">WeatherFit</h1>
    <!-- Top bar: location (left) and date (right) controls -->
    <header class="top-bar">
      <button type="button" class="control" id="location-button" aria-haspopup="dialog">Austin, TX</button>
      <button type="button" class="control" id="date-button" aria-haspopup="dialog">Today</button>
    </header>

    <!-- Temperature, condition, and context line (Req 16) -->
    <section class="conditions" aria-label="Weather conditions">
      <p class="temp" id="temp">--°F</p>
      <p class="condition" id="condition">--</p>
      <p class="context" id="context">Today (current) · Weather: Open-Meteo</p>
      <p class="status" id="status" role="status"></p>
      <button type="button" class="control" id="retry-button" hidden>Try again</button>
    </section>

    <!-- Character is the focus of the screen -->
    <section class="character" role="group" tabindex="0" aria-label="Outfit recommendation">
      <svg class="character-art" id="normal-art" role="img" aria-label="Placeholder character in a light outfit" viewBox="0 0 200 260">
        <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
          <!-- head, hair, face -->
          <path d="M100 18 C132 16 140 52 118 70 C100 82 70 74 68 48 C66 30 82 20 100 18 Z"/>
          <path d="M72 38 C84 24 112 24 128 38"/>
          <path d="M88 48 v4 M112 48 v4"/>
          <path d="M90 62 Q100 70 110 62"/>
          <!-- light layer: loose top with sleeves -->
          <path d="M78 84 C90 90 110 90 122 84 L152 108 L140 130 L124 118 L126 168 L74 168 L76 118 L60 130 L48 108 Z"/>
          <!-- comfy pants -->
          <path d="M74 168 L70 238 L94 238 L100 190 L106 238 L130 238 L126 168"/>
          <!-- shoes -->
          <path d="M66 242 L96 242 M104 242 L134 242"/>
        </g>
      </svg>
      <!-- Hidden Halloween outfit (placeholder art): friendly bedsheet ghost -->
      <svg class="character-art" id="halloween-art" hidden role="img" aria-label="Placeholder character in a Halloween ghost costume" viewBox="0 0 200 260">
        <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
          <path d="M100 22 C60 22 46 56 48 96 L44 238 L62 224 L78 242 L96 226 L114 242 L132 224 L152 238 L152 96 C154 56 140 22 100 22 Z"/>
          <path d="M80 80 a6 9 0 1 0 0.1 0 M120 80 a6 9 0 1 0 0.1 0"/>
          <path d="M88 112 Q100 124 112 112"/>
          <path d="M48 140 Q30 150 36 168 M152 140 Q170 150 164 168"/>
          <path d="M70 244 L96 244 M104 244 L130 244" stroke-width="3"/>
        </g>
      </svg>
      <p class="outfit-caption" id="outfit-caption" aria-live="polite"></p>
    </section>

    <p class="recommendation" id="recommendation"></p>

    <!-- Reminders, built from the recommendation state; hidden when none apply -->
    <div class="reminders" id="reminders" role="note" hidden></div>

    <!-- 7-day forecast strip: laptop layout only (hidden on phone) -->
    <nav class="forecast-strip" id="forecast-strip" aria-label="7-day forecast"></nav>

    <footer class="bottom-bar">
      <a class="control info-link" href="info.html" aria-label="Info">(i) Info</a>
    </footer>
  </main>
  <!-- Date picker: today plus 7 forecast days -->
  <dialog id="date-dialog" aria-labelledby="date-title">
    <h2 id="date-title">Choose a day</h2>
    <ul id="date-list"></ul>
    <button type="button" class="control" id="date-close">Close</button>
  </dialog>

  <!-- Location picker: search a US city or ZIP, then choose a match (city shown with state) -->
  <dialog id="location-dialog" aria-labelledby="location-title">
    <h2 id="location-title">Choose a US location</h2>
    <button type="button" class="control" id="geolocate-button">Use my location</button>
    <form id="location-form">
      <label for="location-input">City or ZIP code</label>
      <div class="search-row">
        <input id="location-input" type="search" autocomplete="off" required>
        <button type="submit" class="control">Search</button>
      </div>
    </form>
    <p id="location-message" role="status"></p>
    <ul id="location-results"></ul>
    <button type="button" class="control" id="location-close">Close</button>
  </dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
