<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherFit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pencil-wobble filter used by .sketch borders and the character drawing -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </svg>
  <main class="screen">
    <h1 class="visually-hidden">WeatherFit</h1>
    <!-- Top bar: location (left) and date (right) controls -->
    <header class="top-bar">
      <button type="button" class="control" id="location-button" aria-haspopup="dialog"><img class="icon" src="assets/ui-location.png" alt="" width="24" height="24"><span id="location-label">Choose location</span></button>
      <button type="button" class="control" id="date-button" aria-haspopup="dialog"><img class="icon" src="assets/ui-calendar.png" alt="" width="24" height="24"><span id="date-label">Today</span></button>
    </header>

    <!-- Temperature, condition, and context line (Req 16) -->
    <section class="conditions" aria-label="Weather conditions">
      <div class="temp-row">
        <img class="weather-icon" id="weather-icon" alt="" width="64" height="64" hidden>
        <p class="temp" id="temp">--°F</p>
      </div>
      <p class="condition" id="condition">--</p>
      <p class="context" id="context">Today (current) · Weather: Open-Meteo</p>
      <p class="status" id="status" role="status"></p>
      <button type="button" class="control" id="retry-button" hidden>Try again</button>
    </section>

    <!-- Character is the focus of the screen -->
    <section class="character" role="group" tabindex="0" aria-label="Outfit recommendation">
      <img class="character-art" id="character-art" src="assets/character-base.png" alt="Character wearing a plain sweater and gray pants" width="1024" height="1365">
      <p class="visually-hidden" id="outfit-announcer" aria-live="polite"></p>
    </section>

    <p class="recommendation" id="recommendation"></p>

    <!-- Reminders, built from the recommendation state; hidden when none apply -->
    <div class="reminders" id="reminders" role="note" hidden></div>

    <!-- 7-day forecast strip: laptop layout only (hidden on phone) -->
    <nav class="forecast-strip" id="forecast-strip" aria-label="7-day forecast"></nav>

    <footer class="bottom-bar">
      <a class="control info-link" href="info.html"><img class="icon" src="assets/ui-info.png" alt="" width="24" height="24"><span>Info</span></a>
    </footer>
  </main>
  <!-- Date picker: today plus 7 forecast days -->
  <dialog id="date-dialog" aria-labelledby="date-title">
    <h2 id="date-title">Choose a day</h2>
    <ul id="date-list"></ul>
    <button type="button" class="control" id="date-close">Close</button>
  </dialog>

  <!-- Location picker: search a US city or ZIP, then choose a match (city shown with state) -->
  <dialog id="location-dialog" aria-labelledby="location-title">
    <h2 id="location-title">Choose a US location</h2>
    <button type="button" class="control" id="geolocate-button">Use my location</button>
    <form id="location-form">
      <label for="location-input">City or ZIP code</label>
      <div class="search-row">
        <input id="location-input" type="search" autocomplete="off" required>
        <button type="submit" class="control">Search</button>
      </div>
    </form>
    <p id="location-message" role="status"></p>
    <ul id="location-results"></ul>
    <button type="button" class="control" id="location-close">Close</button>
  </dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
