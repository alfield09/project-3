<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherFit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pencil-wobble filter used by .sketch borders and the character drawing -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </svg>
  <div class="screen">
    <!-- Top bar: location (left) and date (right) controls -->
    <header class="top-bar">
      <button type="button" class="control" id="location-button">Austin, TX</button>
      <button type="button" class="control" id="date-button">Today</button>
    </header>

    <!-- Temperature, condition, and context line (Req 16) -->
    <section class="conditions" aria-label="Weather conditions">
      <p class="temp">72°F</p>
      <p class="condition">Partly cloudy</p>
      <p class="context">Today (current) · Weather: Open-Meteo</p>
    </section>

    <!-- Character is the focus of the screen -->
    <section class="character" aria-label="Outfit recommendation">
      <svg class="character-art" role="img" aria-label="Placeholder character in a light outfit" viewBox="0 0 200 260">
        <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
          <!-- head, hair, face -->
          <path d="M100 18 C132 16 140 52 118 70 C100 82 70 74 68 48 C66 30 82 20 100 18 Z"/>
          <path d="M72 38 C84 24 112 24 128 38"/>
          <path d="M88 48 v4 M112 48 v4"/>
          <path d="M90 62 Q100 70 110 62"/>
          <!-- light layer: loose top with sleeves -->
          <path d="M78 84 C90 90 110 90 122 84 L152 108 L140 130 L124 118 L126 168 L74 168 L76 118 L60 130 L48 108 Z"/>
          <!-- comfy pants -->
          <path d="M74 168 L70 238 L94 238 L100 190 L106 238 L130 238 L126 168"/>
          <!-- shoes -->
          <path d="M66 242 L96 242 M104 242 L134 242"/>
        </g>
      </svg>
    </section>

    <p class="recommendation" id="recommendation">A light layer and comfy pants will do it today.</p>

    <div class="reminder" role="note">
      <span class="reminder-icon" aria-hidden="true">⚠</span>
      <span id="reminder-text">Reminder: put on sunscreen before heading out.</span>
    </div>

    <!-- 7-day forecast strip: laptop layout only (hidden on phone) -->
    <nav class="forecast-strip" aria-label="7-day forecast">
      <button type="button" class="control day" aria-pressed="true">Today<br>72°F</button>
      <button type="button" class="control day" aria-pressed="false">Mon<br>75°F</button>
      <button type="button" class="control day" aria-pressed="false">Tue<br>68°F</button>
      <button type="button" class="control day" aria-pressed="false">Wed<br>61°F</button>
      <button type="button" class="control day" aria-pressed="false">Thu<br>55°F</button>
      <button type="button" class="control day" aria-pressed="false">Fri<br>52°F</button>
      <button type="button" class="control day" aria-pressed="false">Sat<br>58°F</button>
      <button type="button" class="control day" aria-pressed="false">Sun<br>64°F</button>
    </nav>

    <footer class="bottom-bar">
      <a class="control info-link" href="info.html" aria-label="Info">(i) Info</a>
    </footer>
  </div>
  <!-- Location picker: search a US city or ZIP, then choose a match (city shown with state) -->
  <dialog id="location-dialog" aria-labelledby="location-title">
    <h2 id="location-title">Choose a US location</h2>
    <form id="location-form">
      <label for="location-input">City or ZIP code</label>
      <div class="search-row">
        <input id="location-input" type="search" autocomplete="off" required>
        <button type="submit" class="control">Search</button>
      </div>
    </form>
    <p id="location-message" role="status"></p>
    <ul id="location-results"></ul>
    <button type="button" class="control" id="location-close">Close</button>
  </dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
